name: build the docker image
run-name: ${{ github.actor }} is building the chat docker image
on:
  workflow_dispatch:



jobs:

  build_base_and_prod:
    name: build base and image
    runs-on: ubuntu-latest
    environment: production      # <- this is what changes the sub claim
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
        variant:
          - name: main
            suffix: ""
            build_args: ""
            free_disk: false
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: Prepare CI Dockerfile
      run: |
        awk '
          /^FROM --platform=\$BUILDPLATFORM node:/ {
            print
            print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
            next
          }
          { print }
        ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"
    -   name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    -
        name: Get ACR access token
        id: acr-token
        run: |
          ACR_TOKEN=$(az acr login --name <registry-name> --expose-token --output tsv --query accessToken)
          echo "::add-mask::$ACR_TOKEN" # mask the token in workflow logs
          echo "token=$ACR_TOKEN" >> "$GITHUB_OUTPUT"
    -
        name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: komardataapps.azurecr.io
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}
    - name: Build Docker image
      uses: docker/build-push-action@v5
      id: build
      with:
        context: .
        file: ${{ runner.temp }}/Dockerfile
        push: true
        platforms: ${{ matrix.platform.arch }}
        tags: "komardataapps.azurecr.io/ai/openwebui:${{ github.ref_name }}"
        build-args: |
          BUILD_HASH=${{ github.sha }}
          ${{ matrix.variant.build_args }}