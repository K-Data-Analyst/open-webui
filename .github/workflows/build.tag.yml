name: Tag version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tag-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(jq -er '.version' package.json)
          base="k.v${version}"

          # All remote tags that are either the base tag or base.<number>
          existing=$(git ls-remote --tags origin "refs/tags/${base}" "refs/tags/${base}.*" \
            | sed -e 's#.*refs/tags/##' -e 's/\^{}$//' \
            | sort -u)

          if ! printf '%s\n' "$existing" | grep -qxF "$base"; then
            tag="$base"
          else
            highest=0
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              suffix="${t#"${base}".}"
              # skip entries that didn't actually have the "base." prefix
              [ "$suffix" != "$t" ] || continue
              case "$suffix" in
                ''|*[!0-9]*) continue ;;
              esac
              if [ "$suffix" -gt "$highest" ]; then
                highest="$suffix"
              fi
            done <<< "$existing"
            tag="${base}.$((highest + 1))"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "::notice::package.json version ${version} -> tag ${tag}"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/${tag}"
          echo "::notice::Created tag ${tag}"